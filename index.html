<html>
<head></head>
<body>
    <header>
        <h1>Student Admission Form</h1>
        <b>Complete the form</b>
    </header>
    <main>
        <form method="post">
            <!-- Personal Information -->
            <fieldset>
                <legend>Personal Information</legend>
                <p>
                    <label for="fullName">
                        Full Name:
                    </label>
                    <input id="fullName" name="fullName" type="text" placeholder="Enter Full Name" minlength="3"
                        maxlength="35" autocomplete="name" required />
                </p>
                <p>
                    <label>
                        Email:
                    </label>
                    <input id="email" name="email" type="email" placeholder="student@exmaple.com"
                        autocomplete="email" />
                </p>
                <p>
                    <label for="city">City:</label>
                    <select id="city" name="city">
                        <option value=""> -- Select City -- </option>
                        <option value="Islamabad">Islamabad</option>
                        <option value="Karachi">Karachi</option>
                        <option value="Lahore">Lahore</option>
                        <option value="Rawalpindi">Rawalpindi</option>
                        <option value="Azad Kashmir">Azad Kashmir</option>
                        <option value="Peshawar">Peshawar</option>
                    </select>
                </p>
            </fieldset>
            <br />
            <fieldset>
                <legend>Course Selection</legend>
                <label for="course">Select your Course:</label>
                <select id="course" name="course">
                    <option id=""> -- Select Course -- </option>
                    <option value="web">Web Development</option>
                    <option value="marketing">Digital Marketing</option>
                    <option value="graphic">Graphic Designing</option>
                </select>
            </fieldset>
            <br />
            <fieldset>
                <legend>Preffered Class Shift</legend>
                <input type="radio" id="morning" name="shift" value="morning" checked />
                <label for="morning">Morning</label>
                <input type="radio" id="evening" name="shift" value="evening" />
                <label for="evening">Evening</label>
            </fieldset>
            <br />
            <fieldset>
                <legend>Skills</legend>
                <input type="checkbox" id="html" name="html" />
                <label for="html">Html</label>
                <input type="checkbox" id="css" name="css" />
                <label for="css">CSS</label>
                <input type="checkbox" id="javascript" name="javascript" />
                <label for="javascript">Javascript</label>
            </fieldset>
            <br />
            <label for="message">Why do you join this course?</label>
            <br />
            <textarea id="message" rows="4" cols="35" minlength="10" maxlength="200"></textarea>
            <br />
            <br />
            <button type="submit">Submit Application</button>
        </form>
    </main>
    <footer>
        <p>HTML Learning Project - Batch 2</p>
    </footer>
</body>

</html>
